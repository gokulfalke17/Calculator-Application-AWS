name: CI/CD Spring Boot Docker to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Build Spring Boot JAR
      - name: Build Spring Boot app
        run: mvn clean package -DskipTests

      # 4️⃣ Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 5️⃣ Login to Amazon ECR (MANDATORY)
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t calculator-app:latest .

      # 7️⃣ Tag Docker image for ECR (MANDATORY)
      - name: Tag Docker image
        run: |
          docker tag calculator-app:latest ${{ secrets.ECR_REPOSITORY }}:latest

      # 8️⃣ Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.ECR_REPOSITORY }}:latest
